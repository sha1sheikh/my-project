text: "The Charity Commission had found it to be compliant with the law; it only processed Jgive payments after due diligence and where a project was compliant with charitable purposes; Shivat Zion Lerigvy Admata was not an approved recipient under its grant-making framework; and its donation to Regavim was for a project within Israel's pre-1967 borders, with Regavim no longer an approved recipient."
